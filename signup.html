<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - SUMMIT STEM Platform</title>
  <style>
    :root {
      --bg: #061225;
      --surface: #102038;
      --text: #f8fafc;
      --muted: #9db0c8;
      --line: rgba(157, 176, 200, 0.24);
      --brand: #78d6e2;
      --brand-soft: rgba(120, 214, 226, 0.2);
      --radius: 18px;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 8% -8%, rgba(120, 214, 226, 0.2), transparent 46%),
        radial-gradient(circle at 88% -20%, rgba(79, 126, 200, 0.25), transparent 48%),
        linear-gradient(180deg, #040b18 0%, #061225 30%, #0a1a33 100%);
      color: var(--text);
      line-height: 1.5;
    }

    /* Center the auth card on the screen */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: min(440px, 100%);
      background: linear-gradient(150deg, rgba(16, 32, 56, 0.92), rgba(12, 24, 43, 0.9));
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 70px;
      height: 70px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(157, 176, 200, 0.45);
      box-shadow: 0 8px 18px rgba(79, 126, 200, 0.35);
      margin-bottom: 10px;
    }

    .auth-header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #d5e7f8;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      background: rgba(11, 24, 43, 0.78);
      color: var(--text);
    }

    .field input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(120, 214, 226, 0.2);
    }

    .btn {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8ce3ee, #5ea6df);
      color: #06223d;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .switch-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .switch-link a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
    }

    .back-home a {
      color: var(--muted);
      text-decoration: none;
    }

    .back-home a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 24px;
      }
    }

    /* SUMMIT Foundation-inspired light theme override */
    :root {
      --bg: #dbe3ee;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #c5d1e0;
      --brand: #2f5fa7;
      --brand-soft: #e8f1ff;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    body {
      background: linear-gradient(180deg, #eef3f9 0%, #dbe3ee 70%, #d2dbe7 100%);
      color: var(--text);
    }

    .auth-card {
      background: #dfe7f2 !important;
      border-color: var(--line) !important;
      color: var(--text) !important;
      box-shadow: var(--shadow) !important;
    }

    .auth-header p,
    .switch-link,
    .back-home a {
      color: var(--muted) !important;
    }

    .field label {
      color: #1f2937 !important;
    }

    .field input {
      background: #ffffff !important;
      color: var(--text) !important;
      border-color: var(--line) !important;
    }

    .btn {
      color: #ffffff !important;
      background: linear-gradient(135deg, #2f5fa7, #67b7d7) !important;
    }

    .switch-link a {
      color: #234d8d !important;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img class="auth-logo" src="../.cursor/projects/c-Users-somua-stem-hub/assets/c__Users_somua_AppData_Roaming_Cursor_User_workspaceStorage_24680e058e870a4f6fd8d8a08909f716_images_banner-60e51b41-103b-418d-87d3-44b0b6d3372d.png" alt="The Summit emblem" />
        <h1>Create your account</h1>
        <p>Join the SUMMIT STEM Platform community.</p>
      </div>

      <!-- Front-end only: no real authentication yet -->
      <form onsubmit="event.preventDefault(); window.location.href='./home.html';">
        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full-name" type="text" placeholder="Jane Doe" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" required />
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="Re-enter your password" required />
        </div>

        <button class="btn" type="submit">Create account</button>
      </form>

      <p class="switch-link">
        Already have an account? <a href="./index.html">Login</a>
      </p>
      <p class="back-home"><a href="./home.html">Back to platform home</a></p>
    </div>
  </div>
</body>
</html>
