<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SUMMIT STEM Platform</title>
  <style>
    :root {
      --bg: #061225;
      --surface: #102038;
      --text: #f8fafc;
      --muted: #9db0c8;
      --line: rgba(157, 176, 200, 0.24);
      --brand: #78d6e2;
      --brand-soft: rgba(120, 214, 226, 0.2);
      --radius: 18px;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 8% -8%, rgba(120, 214, 226, 0.2), transparent 46%),
        radial-gradient(circle at 88% -20%, rgba(79, 126, 200, 0.25), transparent 48%),
        linear-gradient(180deg, #040b18 0%, #061225 30%, #0a1a33 100%);
      color: var(--text);
      line-height: 1.5;
    }

    /* Center the auth card on the screen */
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: min(440px, 100%);
      background: linear-gradient(150deg, rgba(16, 32, 56, 0.92), rgba(12, 24, 43, 0.9));
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 2px);
      box-shadow: var(--shadow);
      padding: 32px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 70px;
      height: 70px;
      border-radius: 999px;
      object-fit: cover;
      border: 1px solid rgba(157, 176, 200, 0.45);
      box-shadow: 0 8px 18px rgba(79, 126, 200, 0.35);
      margin-bottom: 10px;
    }

    .auth-header h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
    }

    .auth-header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #d5e7f8;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      background: rgba(11, 24, 43, 0.78);
      color: var(--text);
    }

    .field input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(120, 214, 226, 0.2);
    }

    .btn {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8ce3ee, #5ea6df);
      color: #06223d;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    .forgot {
      text-align: right;
      margin-bottom: 18px;
    }

    .forgot a,
    .switch-link a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot a:hover,
    .switch-link a:hover {
      text-decoration: underline;
    }

    .switch-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .back-home {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
    }

    .back-home a {
      color: var(--muted);
      text-decoration: none;
    }

    .back-home a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 24px;
      }
    }

    /* SUMMIT Foundation-inspired light theme override */
    :root {
      --bg: #d6dee8;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #bcc9d8;
      --brand: #2f5fa7;
      --brand-soft: #e8f1ff;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
    }

    body {
      background: linear-gradient(180deg, #edf2f8 0%, #d6dee8 70%, #cfd8e3 100%);
      color: var(--text);
    }

    .auth-card {
      background: #ffffff !important;
      border-color: var(--line) !important;
      color: var(--text) !important;
      box-shadow: var(--shadow) !important;
    }

    .auth-header p,
    .switch-link,
    .back-home a {
      color: var(--muted) !important;
    }

    .field label {
      color: #1f2937 !important;
    }

    .field input {
      background: #ffffff !important;
      color: var(--text) !important;
      border-color: var(--line) !important;
    }

    .btn {
      color: #ffffff !important;
      background: linear-gradient(135deg, #2f5fa7, #67b7d7) !important;
    }

    .forgot a,
    .switch-link a {
      color: #234d8d !important;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img class="auth-logo" src="./assets/summit-emblem.png?v=2" alt="The Summit emblem" />
        <h1>Welcome back</h1>
        <p>Log in to your SUMMIT STEM Platform account.</p>
      </div>

      <!-- Supabase email/password authentication -->
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="text" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <div class="forgot">
          <a id="forgot-password-link" href="#">Forgot password?</a>
        </div>

        <button class="btn" type="submit">Login</button>
      </form>

      <p class="switch-link">
        Don't have an account? <a href="./signup.html">Sign up</a>
      </p>
      <p class="back-home"><a href="./home.html">Back to platform home</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const ADMIN_BYPASS_EMAIL = "1";
    const ADMIN_BYPASS_PASSWORD = "1";
    const ADMIN_BYPASS_KEY = "summitAdminBypass";
    const loginForm = document.getElementById("login-form");
    const forgotPasswordLink = document.getElementById("forgot-password-link");

    if (localStorage.getItem(ADMIN_BYPASS_KEY) === "true") {
      window.location.href = "./leadership-dashboard.html";
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = (document.getElementById("email").value || "").trim().toLowerCase();
      const password = document.getElementById("password").value;

      if (email === ADMIN_BYPASS_EMAIL && password === ADMIN_BYPASS_PASSWORD) {
        localStorage.setItem(ADMIN_BYPASS_KEY, "true");
        localStorage.setItem("summitAdminBypassUser", "Admin");
        window.location.href = "./leadership-dashboard.html";
        return;
      }

      try {
        const supabase = window.getSummitSupabaseClient();
        const { data, error } = await supabase.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
        localStorage.removeItem(ADMIN_BYPASS_KEY);
        localStorage.removeItem("summitAdminBypassUser");

        const userId = data.user?.id;
        if (!userId) throw new Error("Login succeeded but user was not returned.");

        const { data: profile, error: profileError } = await supabase
          .from("profiles")
          .select("id, full_name, email, role")
          .eq("id", userId)
          .single();

        if (profileError || !profile) {
          const metadataName = data.user?.user_metadata?.full_name || "";
          const displayName = (metadataName || email.split("@")[0] || "Student").trim();
          const { error: upsertError } = await supabase.from("profiles").upsert({
            id: userId,
            full_name: displayName,
            email: data.user?.email || email
          });
          if (upsertError) throw upsertError;
        }

        window.location.href = "./home.html";
      } catch (err) {
        alert(err.message || "Login failed. Please check your credentials.");
      }
    });

    forgotPasswordLink.addEventListener("click", async (event) => {
      event.preventDefault();
      const email = (document.getElementById("email").value || "").trim();
      if (email === ADMIN_BYPASS_EMAIL) {
        alert("Admin bypass login does not use password reset.");
        return;
      }
      if (!email) {
        alert("Enter your email first, then click Forgot password.");
        return;
      }

      try {
        const supabase = window.getSummitSupabaseClient();
        const { error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) throw error;
        alert("Password reset email sent. Check your inbox and spam folder.");
      } catch (err) {
        alert(err.message || "Unable to send password reset email.");
      }
    });
  </script>
</body>
</html>
